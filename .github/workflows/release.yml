name: Release

# A tag vX.Y.Z publishes a stable release (binaries, images tagged X.Y.Z and latest).
# A tag with a suffix, e.g. v0.1.0-rc1, publishes a GitHub pre-release and images tagged
# 0.1.0-rc1 only; `latest` is left untouched.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0, or v0.1.0-rc1 for a pre-release)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  PRERELEASE: ${{ contains(github.ref_type == 'tag' && github.ref_name || inputs.version, '-') }}

jobs:
  binaries:
    name: Cross-Compile Static Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: read  # pull the devcontainer image
    container:
      image: ghcr.io/rjuho/jokateko-devcontainer:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build and Cross-Compile Static Binaries
        run: make cross-compile VERSION=$VERSION

      # Run the installer against the binaries about to be published (checksum check, install, run)
      - name: Verify Installer
        run: sh tests/install/run.sh bin

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VERSION }}
          body: "Highlights: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.VERSION }}/CHANGELOG.md)"
          prerelease: ${{ env.PRERELEASE == 'true' }}
          # Immutable releases lock assets once published: prereleases (published first by
          # this action) start as drafts, publish them by hand after the upload
          draft: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          files: |
            bin/jokateko-linux-amd64
            bin/jokateko-linux-arm64
            bin/jokateko-darwin-amd64
            bin/jokateko-darwin-arm64
            bin/jokateko-windows-amd64.exe
            bin/checksums.txt
            site/install.sh
          generate_release_notes: true

  # Serve site/ (install.sh) at https://jokateko.dev for stable releases only, after the release
  # exists, so the script and the `latest` binaries it downloads always come from the same release.
  pages:
    name: Publish Installer to GitHub Pages
    runs-on: ubuntu-latest
    needs: binaries
    if: ${{ !contains(github.ref_type == 'tag' && github.ref_name || inputs.version, '-') }}
    permissions:
      pages: write    # deploy to GitHub Pages
      id-token: write # verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  devcontainer:
    name: Build & Publish Devcontainer Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push ghcr.io/rjuho/jokateko-devcontainer
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Devcontainer metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/rjuho/jokateko-devcontainer
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}

      - name: Build and push devcontainer image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker:
    name: Build & Publish Scratch Docker Image
    runs-on: ubuntu-latest
    needs: [binaries, devcontainer]
    permissions:
      contents: read
      packages: write # push ghcr.io/rjuho/jokateko
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/rjuho/jokateko
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}

      # Build from the exact devcontainer image this run just pushed (by digest), not a moving tag.
      - name: Build and push multi-arch scratch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            DEVCONTAINER_IMAGE=ghcr.io/rjuho/jokateko-devcontainer@${{ needs.devcontainer.outputs.digest }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
