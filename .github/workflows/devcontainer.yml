name: Devcontainer CI

on:
  push:
    branches: [ main ]
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/devcontainer.json'
  pull_request:
    branches: [ main ]
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/devcontainer.json'
  workflow_dispatch:

# Automatically cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devcontainer-ci:
    name: Dev Container Validation & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image (main only; fork PRs never get write access)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Dev Container CI
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/rjuho/jokateko-devcontainer
          cacheFrom: ghcr.io/rjuho/jokateko-devcontainer
          push: ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
          runCmd: make test && make e2e-test && make build && ./bin/jokateko parse
