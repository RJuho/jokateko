name: Devcontainer CI

on:
  push:
    branches: [ main ]
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/devcontainer.json'
  pull_request:
    branches: [ main ]
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/devcontainer.json'
  workflow_dispatch:

# Automatically cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  devcontainer-ci:
    name: Dev Container Validation & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Dev Container CI
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/rjuho/jokateko-devcontainer
          cacheFrom: ghcr.io/rjuho/jokateko-devcontainer
          push: ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
          runCmd: make test && make e2e-test && make build && ./bin/jokateko parse
