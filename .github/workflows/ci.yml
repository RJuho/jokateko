name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.devcontainer/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.devcontainer/**'
  workflow_dispatch:

# Automatically cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. Pull requests from forks get the same (GitHub never grants them write access);
# the devcontainer image must be a public package so their runs can pull it.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Codebase Validation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rjuho/jokateko-devcontainer:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build Web UI
        run: make ui-build

      - name: Run Go Unit Tests
        run: make test

      # Compare against the PR base, or against the commit before this push (all commits of a
      # multi-commit push). Run E2E when the range is unknown (new branch, force push, manual run).
      - name: Check for Web or E2E Changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! DIFF=$(git diff --name-only "$BASE" HEAD 2>/dev/null); then
            echo "Change range unknown -> E2E testing will run."
            echo "has_web_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files since $BASE:"
          echo "$DIFF"
          if echo "$DIFF" | grep -qE '^(web/|tests/(e2e|lighthouse)/|playwright\.config\.ts|Makefile|\.github/workflows/)'; then
            echo "has_web_changes=true" >> "$GITHUB_OUTPUT"
            echo "Web or E2E changes detected -> E2E testing will run."
          else
            echo "has_web_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Web or E2E changes detected -> Skipping E2E testing."
          fi

      - name: Run Playwright E2E Tests
        if: steps.changes.outputs.has_web_changes == 'true'
        run: make e2e-test

      - name: Build Binary & Validate Project
        run: |
          make build
          ./bin/jokateko parse
