name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.devcontainer/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.devcontainer/**'
  workflow_dispatch:

# Automatically cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Codebase Validation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rjuho/jokateko-devcontainer:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Web UI
        run: make ui-build

      - name: Run Go Unit Tests
        run: make test

      - name: Check for Web or E2E Changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "web/")
          fi
          echo "Detected changed files:"
          echo "$DIFF"
          if echo "$DIFF" | grep -qE '^(web/|tests/(e2e|lighthouse)/|playwright\.config\.ts)'; then
            echo "has_web_changes=true" >> $GITHUB_OUTPUT
            echo "Web or E2E changes detected -> E2E testing will run."
          else
            echo "has_web_changes=false" >> $GITHUB_OUTPUT
            echo "No Web or E2E changes detected -> Skipping E2E testing."
          fi

      - name: Run Playwright E2E Tests
        if: steps.changes.outputs.has_web_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: make e2e-test

      - name: Build Binary & Validate Project
        run: |
          make build
          ./bin/jokateko parse
