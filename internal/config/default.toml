# ==============================================================================
# Jokateko - Default Configuration Specification
# ==============================================================================
# This configuration file is embedded directly into the Jokateko binary and serves
# as the single source of truth for all default application settings.
#
# If you place a custom config.toml (or .jokateko/config.toml) in your workspace,
# any settings you define will cleanly overlay and merge with these defaults.
# You only need to specify the keys you wish to override.
# ==============================================================================

version = "0"

[project]
name = "My Project"
description = "Markdown-driven task management and Kanban"

[paths]
tasks = ".jokateko/tasks"
milestones = ".jokateko/milestones"
strategies = ".jokateko/strategies"
glossary = ".jokateko/glossary"
export = "dist-kanban/index.html"

[server]
host = "127.0.0.1"
port = 8080
open_browser = false

[server.security]
cors_enabled = true
cors_allowed_origins = [
  "http://localhost:8080",
  "http://127.0.0.1:8080"
]

[server.security.csp]
enabled = true
default_src = ["'self'"]
script_src = ["'self'"]
style_src = ["'self'"]
style_src_elem = ["'self'", "'unsafe-inline'"]
style_src_attr = ["'unsafe-inline'"]
img_src = ["'self'", "data:"]
connect_src = ["'self'"]
font_src = ["'self'"]

# ------------------------------------------------------------------------------
# Workflow Columns & Policies
# ------------------------------------------------------------------------------
[board]
# List of workflow statuses in which a task's full body specification can be edited.
# In all other states, tasks are locked and only notes can be appended.
editable_states = ["backlog"]

# List of workflow statuses in which new tasks can be created (restricts '+' button in UI).
creatable_states = ["backlog"]

# Default column status assigned to newly created tasks when status is omitted.
default_create_state = "backlog"

# Each column defines a Kanban board swimlane.
# Optional fields:
#   handled_by     - Assigned agent persona, model, or human role (e.g. "human", "agent:coder", "agent:reviewer")
#   instructions   - Workflow guidance and exit/entry criteria dynamically served to AI agents via MCP
#   sort_by        - Secondary task sorting criteria: "default", "priority", "target_at", "changed_at", "created_at", "title", "id"
#   sort_direction - Direction for custom sort_by: "asc" or "desc" (defaults to "asc")
#
# Default Sorting Model (when sort_by is omitted or "default"):
#   Active & Backlog columns (backlog, ready, in_progress, in_review):
#     Primary: Priority (critical > high > medium > low)
#     Secondary: State-specific (backlog: changed_at desc; ready/in_progress/in_review: target_at asc with fallback to changed_at desc)
#   Done column:
#     Primary: Recently changed (changed_at desc) - priority does not matter anymore when task is done
#   Tertiary: Deterministic tie-breaker by task ID ascending
[[board.columns]]
id = "backlog"
name = "Backlog"
color = "#94a3b8"

[[board.columns]]
id = "ready"
name = "Ready"
color = "#60a5fa"

[[board.columns]]
id = "in_progress"
name = "In Progress"
color = "#f59e0b"

[[board.columns]]
id = "in_review"
name = "In Review"
color = "#a855f7"

[[board.columns]]
id = "done"
name = "Done"
color = "#10b981"

# ------------------------------------------------------------------------------
# Task Priorities
# ------------------------------------------------------------------------------
[[priorities]]
id = "critical"
name = "Critical"
color = "#ef4444"

[[priorities]]
id = "high"
name = "High"
color = "#f97316"

[[priorities]]
id = "medium"
name = "Medium"
color = "#eab308"

[[priorities]]
id = "low"
name = "Low"
color = "#3b82f6"

# ------------------------------------------------------------------------------
# Architectural Strategy Tiers (Progressive Disclosure)
# ------------------------------------------------------------------------------
# Jokateko uses a tiered architecture system to structure rules and guidelines.
# AI agents access these tiers progressively over MCP so token limits are not
# exhausted. Tier 1 represents critical, non-negotiable invariants, while deeper
# tiers provide domain patterns and implementation specifications.
# ------------------------------------------------------------------------------
[[strategies.tiers]]
id = "1"
name = "Tier 1"
title = "Core Architecture & Tech Stack"
summary = "System-wide non-negotiables: tech stack limits, project structure, and absolute constraints."
color = "#ef4444"

[[strategies.tiers]]
id = "2"
name = "Tier 2"
title = "Domain Logic & Data Flow"
summary = "Rules for API design, database interactions, authentication, and state management."
color = "#3b82f6"

[[strategies.tiers]]
id = "3"
name = "Tier 3"
title = "Code Conventions & UI Standards"
summary = "Implementation details: naming conventions, testing requirements, UI styling, and accessibility."
color = "#10b981"

# ------------------------------------------------------------------------------
# Controlled Tag Vocabulary
# ------------------------------------------------------------------------------
[tags]
allowed = [
  "backend",
  "frontend",
  "database",
  "security",
  "ui",
  "auth",
  "api",
  "docs",
  "testing",
  "release",
  "infra"
]
enforce_allowed = true

# ------------------------------------------------------------------------------
# Model Context Protocol (MCP) for AI Agents
# ------------------------------------------------------------------------------
[mcp]
enabled = true
timeout_seconds = 30
allow_mutations = true
instructions = """
Jokateko manages tasks, milestones, architectural strategies, and glossary terms as version-controlled Markdown files in the repository (.jokateko/).

Core Workflow Rules:
1. Always use get_task to inspect full acceptance criteria before starting work.
2. Use update_task_item to toggle checklists as items are completed.
3. Use complete_task when finished to record completion summary and unblock downstream tasks.
4. Always consult Tier-1 architectural strategies via get_strategy before making architectural decisions.
5. All modifications to .jokateko/ files must be performed via Jokateko MCP tools rather than direct file edits, ensuring atomic disk persistence and schema validation.
6. Never edit files in .jokateko/ directly with file writing tools; direct writes bypass schema validation, cycle checks, and live UI event broadcasting.
"""

